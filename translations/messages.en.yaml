tmonier_punchout:
    ui:
        session:
            banner: 'PunchOut session — %buyer%'
            help: 'Your cart will be sent to your procurement system. Orders are placed there, not in this shop.'
            transfer: 'Transfer to my procurement system'
            cancel: 'Cancel and go back'
            unavailable: 'These items are no longer available and were left out: %parts%'
        menu:
            buyers: 'PunchOut Buyers'
            logs: 'PunchOut log'
        secret:
            title: 'New shared secret'
            help: 'Copy it now and give it to the buyer: it will not be shown again (only its hash is stored).'
            regenerate: 'Generate a new secret'
            section: 'Shared secrets'
            rotation_help: 'A new secret is added next to the current one so the procurement system can switch over; revoke the old one afterwards. At most two secrets are active.'
            created: 'Secret created on %date%'
            revoke: Revoke
            none: 'No active secret: the buyer cannot open a session.'
            or: or
            set: 'Use this secret'
            set_placeholder: 'Secret imposed by the procurement system'
        inspect:
            title: Requisition
            help: 'Read-only view of your requisition. Go back to your procurement system to change it.'
            unknown: 'Unknown item'
            empty: 'No item.'
            back: 'Back to my procurement system'
        log:
            buyer: Buyer
            direction: Direction
            type: Type
            payload_id: payloadID
            status: Status
            no_body: 'The body is not kept (log_bodies disabled); only its SHA-256 is.'
        message_logs: 'PunchOut log'
    form:
        buyer:
            name: Name
            protocol:
                label: Protocol
                cxml: cXML
                oci: OCI
            enabled: Enabled
            customer: 'Sylius customer (e-mail)'
            customer_help: 'The PunchOut sessions log in as this customer: their prices and groups apply.'
            return_domains: 'Allowed return domains'
            return_domains_help: 'One entry per line: s1.ariba.com (exactly this host) or *.ariba.com (its subdomains). Required: the cart is only sent to these hosts.'
            identities: 'cXML identities'
            iframe_origins: 'Iframe origins'
            iframe_origins_help: 'Origins allowed to show the shop in an iframe during a PunchOut session, one per line (e.g. https://s1.ariba.com).'
            fromIdentities: 'From identities (buyer)'
            senderIdentities: 'Sender identities (network or system)'
            identities_format: 'One identity per line: domain then identity, e.g. NetworkId AN01000000001 or DUNS 123456789.'
            include_tax: 'Send the tax of the cart'
            include_shipping: 'Send the shipping of the cart'
            default_unit: 'Default unit of measure'
            default_unspsc: 'Default UNSPSC code'
        classification:
            unspsc: 'UNSPSC code (PunchOut)'
            unspsc_help: '8 digits, e.g. 56101504. Products inherit the code of their main taxon or its parents.'
            unit: 'Unit of measure (PunchOut)'
            unit_help: 'UN/CEFACT code expected by procurement systems, e.g. EA (each), C62 (piece), BX (box).'
    flash:
        buyer:
            created: 'PunchOut buyer has been created.'
            updated: 'PunchOut buyer has been updated.'
            deleted: 'PunchOut buyer has been deleted.'
    error:
        unauthorized: 'Authentication failed.'
        return_url_not_allowed: 'Return URL is not allowed.'
        session_not_found: 'PunchOut session not found or expired.'
        no_active_session: 'No active PunchOut session.'
        xml_parse_error: 'XML parse error.'
        request_too_large: 'Request body is too large.'
