sylius_twig_hooks:
    hooks:
        # Cart page in a PunchOut session: banner, "Transfer" and "Cancel" (outside the cart form).
        'sylius_shop.cart.index.content':
            tmonier_punchout_session:
                template: '@TmonierSyliusPunchoutCxmlPlugin/shop/cart/punchout_session.html.twig'
                priority: 200

        # US-014: in a PunchOut session the Sylius checkout gives way to the transfer. The templates
        # include Sylius' own ones outside a session (no hook "condition": unknown to Sylius 2.2).
        'sylius_shop.cart.index.content.form.sections.general#right':
            checkout:
                template: '@TmonierSyliusPunchoutCxmlPlugin/shop/cart/checkout.html.twig'

        'sylius_shop.base.offcanvas.cart':
            footer:
                template: '@TmonierSyliusPunchoutCxmlPlugin/shop/offcanvas/footer.html.twig'
