sylius_twig_hooks:
    hooks:
        'tmonier_punchout_admin.buyer.create.content.form.sections.general':
            default:
                enabled: false
            fields:
                template: '@TmonierSyliusPunchoutCxmlPlugin/admin/buyer/form/fields.html.twig'
                priority: 0

        'tmonier_punchout_admin.buyer.update.content.form.sections.general':
            default:
                enabled: false
            secret:
                template: '@TmonierSyliusPunchoutCxmlPlugin/admin/buyer/form/secret.html.twig'
                priority: 100
            fields:
                template: '@TmonierSyliusPunchoutCxmlPlugin/admin/buyer/form/fields.html.twig'
                priority: 0

        'tmonier_punchout_admin.buyer.update.content.header':
            breadcrumbs:
                template: '@SyliusAdmin/shared/crud/update/content/header/breadcrumbs.html.twig'
                configuration:
                    rendered_field: name
                priority: 100

        # Outside the edit form (no nested form): target of the "Regenerate the secret" button.
        'tmonier_punchout_admin.buyer.update.content':
            regenerate_secret_form:
                template: '@TmonierSyliusPunchoutCxmlPlugin/admin/buyer/regenerate_secret_form.html.twig'
                priority: -100

        # US-005: UNSPSC code and unit of measure of products and taxons.
        'sylius_admin.product.create.content.form.sections.general':
            tmonier_punchout_classification:
                template: '@TmonierSyliusPunchoutCxmlPlugin/admin/classification/fields.html.twig'
                priority: -150
        'sylius_admin.product.update.content.form.sections.general':
            tmonier_punchout_classification:
                template: '@TmonierSyliusPunchoutCxmlPlugin/admin/classification/fields.html.twig'
                priority: -150
        'sylius_admin.taxon.create.content.sections.form.general':
            tmonier_punchout_classification:
                template: '@TmonierSyliusPunchoutCxmlPlugin/admin/classification/fields.html.twig'
                priority: -150
        'sylius_admin.taxon.update.content.sections.form.general':
            tmonier_punchout_classification:
                template: '@TmonierSyliusPunchoutCxmlPlugin/admin/classification/fields.html.twig'
                priority: -150

        # US-024: detail of a logged exchange (masked body).
        'tmonier_punchout_admin.message_log.show.content':
            tmonier_punchout_details:
                template: '@TmonierSyliusPunchoutCxmlPlugin/admin/message_log/show.html.twig'
                priority: -100
