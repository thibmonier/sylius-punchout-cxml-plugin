sylius_grid:
    grids:
        tmonier_punchout_admin_buyer:
            driver:
                name: doctrine/orm
                options:
                    class: "%tmonier_punchout.model.buyer.class%"
            sorting:
                name: asc
            fields:
                code:
                    type: string
                    label: sylius.ui.code
                    sortable: ~
                name:
                    type: string
                    label: sylius.ui.name
                    sortable: ~
                protocol:
                    type: twig
                    label: tmonier_punchout.form.buyer.protocol.label
                    options:
                        template: "@TmonierSyliusPunchoutCxmlPlugin/admin/buyer/grid/field/protocol.html.twig"
                customer:
                    type: twig
                    label: tmonier_punchout.form.buyer.customer
                    path: .
                    options:
                        template: "@TmonierSyliusPunchoutCxmlPlugin/admin/buyer/grid/field/customer.html.twig"
                channel:
                    type: twig
                    label: sylius.ui.channel
                    path: .
                    options:
                        template: "@TmonierSyliusPunchoutCxmlPlugin/admin/buyer/grid/field/channel.html.twig"
                enabled:
                    type: twig
                    label: sylius.ui.enabled
                    sortable: ~
                    options:
                        template: "@SyliusAdmin/shared/grid/field/boolean.html.twig"
            filters:
                search:
                    type: string
                    label: sylius.ui.search
                    options:
                        fields: [code, name]
                enabled:
                    type: boolean
                    label: sylius.ui.enabled
            actions:
                main:
                    create:
                        type: create
                item:
                    update:
                        type: update
                    delete:
                        type: delete
                bulk:
                    delete:
                        type: delete
