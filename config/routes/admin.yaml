tmonier_punchout_admin_buyer:
    resource: |
        alias: tmonier_punchout.buyer
        section: admin
        templates: "@SyliusAdmin\\shared\\crud"
        except: ['show']
        redirect: update
        grid: tmonier_punchout_admin_buyer
        form:
            type: Tmonier\SyliusPunchoutCxmlPlugin\Form\Type\Admin\BuyerType
        permission: true
        path: punchout-buyers
        vars:
            all:
                hook_prefix: tmonier_punchout_admin.buyer
    type: sylius.resource

tmonier_punchout_admin_buyer_regenerate_secret:
    path: /punchout-buyers/{id}/regenerate-secret
    methods: [POST]
    requirements:
        id: '\d+'
    defaults:
        _controller: tmonier_punchout.controller.admin_regenerate_secret
