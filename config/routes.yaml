# Import this file from your application's config/routes:
#
# tmonier_sylius_punchout_cxml:
#     resource: "@TmonierSyliusPunchoutCxmlPlugin/config/routes.yaml"

tmonier_punchout_admin:
    resource: "@TmonierSyliusPunchoutCxmlPlugin/config/routes/admin.yaml"
    prefix: '/%sylius_admin.path_name%'

tmonier_punchout_cxml_endpoint:
    path: /punchout/cxml
    controller: tmonier_punchout.controller.cxml_endpoint
    methods: [POST]
    defaults:
        _format: xml
        _sylius:
            template: ~

tmonier_punchout_start:
    path: /punchout/start/{token}
    controller: tmonier_punchout.controller.start
    methods: [GET, HEAD]
    requirements:
        token: '[A-Za-z0-9_-]{43,}'

tmonier_punchout_transfer:
    path: /punchout/transfer
    controller: tmonier_punchout.controller.transfer
    methods: [POST]

tmonier_punchout_cancel:
    path: /punchout/cancel
    controller: tmonier_punchout.controller.transfer
    methods: [POST]
    defaults:
        cancel: true
