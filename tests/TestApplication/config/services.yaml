services:
    Tests\Tmonier\SyliusPunchoutCxmlPlugin\Controller\SimulatorController:
        arguments:
            $twig: '@twig'
            $csrfTokenManager: '@security.csrf.token_manager'
            $httpKernel: '@http_kernel'
        public: true

    Tests\Tmonier\SyliusPunchoutCxmlPlugin\Controller\CartTestController:
        arguments:
            $cartContext: '@sylius.context.cart'
            $orderItemFactory: '@sylius.factory.order_item'
            $quantityModifier: '@sylius.modifier.order_item_quantity'
            $orderModifier: '@sylius.modifier.order'
            $orderProcessor: '@sylius.order_processing.order_processor'
            $variantRepository: '@sylius.repository.product_variant'
            $entityManager: '@doctrine.orm.entity_manager'
        public: true

    # The functional tests reset the rate limiters of the plugin before each test (Symfony 6.4 removes
    # private services used once from the test container).
    tmonier_punchout.test.setup_limiter:
        alias: limiter.tmonier_punchout_setup
        public: true
    tmonier_punchout.test.authentication_failure_limiter:
        alias: limiter.tmonier_punchout_authentication_failure
        public: true
    tmonier_punchout.test.oci_entry_limiter:
        alias: limiter.tmonier_punchout_oci_entry
        public: true
    tmonier_punchout.test.identity_failure_limiter:
        alias: limiter.tmonier_punchout_identity_failure
        public: true
