imports:
    - { resource: "@TmonierSyliusCompanyAccountsPlugin/config/config.yaml" }
    - { resource: "@TmonierSyliusPunchoutCxmlPlugin/config/config.yaml" }
    - { resource: "@TmonierSyliusPunchoutCxmlPlugin/tests/TestApplication/config/services.yaml" }

parameters:
    env(PUNCHOUT_SUPPLIER_DOMAIN): 'NetworkId'
    env(PUNCHOUT_SUPPLIER_IDENTITY): 'demo-supplier@example.com'

twig:
    paths:
        '%kernel.project_dir%/../../../tests/TestApplication/templates': ~

# Simulator routes (TestApplication only — never exposed in production)
tmonier_sylius_punchout_cxml:
    supplier_identity:
        domain: '%env(PUNCHOUT_SUPPLIER_DOMAIN)%'
        identity: '%env(PUNCHOUT_SUPPLIER_IDENTITY)%'
    # The buyer simulator receives the cart on the local dev server (http://localhost:8101).
    insecure_return_url_hosts: [localhost, 127.0.0.1]
    # Masked bodies are kept in the test application to check the masking (off by default).
    log_bodies: true

sylius_fixtures:
    suites:
        default:
            fixtures:
                tmonier_punchout_demo:
                    priority: -100
