tmonier_punchout_simulator_cxml:
    path: /simulator/cxml
    controller: Tests\Tmonier\SyliusPunchoutCxmlPlugin\Controller\SimulatorController::send
    methods: [GET, POST]

tmonier_punchout_simulator_receive:
    path: /simulator/receive
    controller: Tests\Tmonier\SyliusPunchoutCxmlPlugin\Controller\SimulatorController::receive
    methods: [GET, POST]

# Test-only: generates a CSRF token within a request context so tests can get valid tokens.
# Never expose in production — only loaded via the TestApplication routes.
tmonier_punchout_simulator_csrf_token:
    path: /simulator/csrf-token
    controller: Tests\Tmonier\SyliusPunchoutCxmlPlugin\Controller\SimulatorController::csrfToken
    methods: [GET]

# Test-only: current cart (through the Sylius composite cart context) and add-to-cart.
tmonier_punchout_test_cart:
    path: /simulator/test/cart
    controller: Tests\Tmonier\SyliusPunchoutCxmlPlugin\Controller\CartTestController::show
    methods: [GET]

tmonier_punchout_test_cart_add:
    path: /simulator/test/cart/add
    controller: Tests\Tmonier\SyliusPunchoutCxmlPlugin\Controller\CartTestController::add
    methods: [POST]
