constraints:
  - publié en MIT, packagist tmonier/sylius-punchout-cxml-plugin, GitHub thibmonier
  - socle qualité claude-craft (ECS, PHPStan level max, Rector, PHPUnit unit + functional, CI matrice Sylius 2.2/2.3)
  - aucun identifiant ni secret réaliste en dur dans les tests (GitGuardian)
  - pas de communication tant que le positionnement vs Sylius Plus n'est pas établi

